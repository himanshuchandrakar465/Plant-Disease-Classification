    { name = "himanshuchandrakar465", email = "himanshuchandrakar465@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
